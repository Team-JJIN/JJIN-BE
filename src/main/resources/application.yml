spring:
  profiles:
    active: local

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ETC
  mobile-app: JJIN
  place-sync:
    candidate-cache-ttl: 6h
    detail-cache-ttl: 24h
  visitor-stats:
    operation: locgoRegnVisitrDDList
    cache-ttl: 24h
    page-size: 5000
    max-pages: 10
    lookback-days: 30
  attraction-concentration:
    service-path: TatsCnctrRateService
    operation: tatsCnctrRatedList
    cache-ttl: 24h
    page-size: 100
    max-pages: 20
    baseline-weight: 0.5
